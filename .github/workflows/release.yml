# Tag vX.Y.Z or vX.Y.Z-rcN: build + QA everything (build.yml), then publish
# one release with every file under its stable name.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit
  publish:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          merge-multiple: true
          path: out
      - run: ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AISO ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: false
          files: out/*
          body: |
            AISO open beta. Install the desktop app on your home computer: it IS your host (setup wizard on first run).
            Phones: Android APK below; iPhone/iPad: open your host's address in Safari → Add to Home Screen.
            Headless server: aiso-host.tgz (`node aiso.mjs boot`). Builds are unsigned: see the landing page.
            Reproducible: `npm ci && npm run build && sha256sum -c SHA256SUMS`.
