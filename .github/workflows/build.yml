# Build every version and QA each one on its own OS.
# Runs on every push to a branch; release.yml calls it for tags and publishes.
# Every artifact is renamed to a STABLE name (web/releases.js links these).
name: build
on:
  push:
    branches: ['**']
  workflow_dispatch:
  workflow_call:

defaults:
  run:
    shell: bash

# A newer push supersedes an older run on the same branch (saves CI minutes).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  deployment:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Staging filesystem and authenticated health-check boundaries
        run: python -m unittest discover -s deploy -p 'test_*.py' -v

  # The optional cloud relay must never expose its owner's token anonymously.
  huggingface:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: integrations/huggingface/requirements.txt
      - run: pip install -r integrations/huggingface/requirements.txt
      - name: Authenticated relay HTTP checks (synthetic host)
        run: python -m unittest discover -s integrations/huggingface -p 'test_*.py' -v

  # ---------------------------------------------------------------- the engine
  # The host as one native executable (Node SEA), per OS, on that OS.
  engine:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
          - os: macos-latest
            triple: universal-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm ci --prefix host
      - name: Tests (once)
        if: matrix.os == 'ubuntu-22.04'
        run: npm test
      - name: Build the engine
        if: matrix.os != 'macos-latest'
        run: |
          npm run build:sea
          mkdir -p out
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          cp "dist/sea/aiso$ext" "out/aiso-engine-${{ matrix.triple }}$ext"
      - name: Build the engine (macOS universal = arm64 + x64)
        if: matrix.os == 'macos-latest'
        run: |
          npm run build:sea && cp dist/sea/aiso /tmp/aiso-arm64
          # The same bundle, wrapped in x64 Node (runs under Rosetta): the SEA copies the running node.
          V=$(node -p process.version)
          curl -fsSL "https://nodejs.org/dist/$V/node-$V-darwin-x64.tar.gz" | tar xz -C /tmp
          "/tmp/node-$V-darwin-x64/bin/node" tools/build.mjs --sea --inject-only && cp dist/sea/aiso /tmp/aiso-x64
          file /tmp/aiso-arm64 /tmp/aiso-x64
          mkdir -p out
          lipo -create /tmp/aiso-arm64 /tmp/aiso-x64 -output out/aiso-engine-universal-apple-darwin
          codesign --force --sign - out/aiso-engine-universal-apple-darwin
          lipo -info out/aiso-engine-universal-apple-darwin
      - name: Smoke-test the engine
        run: |
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          export AISO_HOME="$RUNNER_TEMP/aisohome"
          "out/aiso-engine-${{ matrix.triple }}$ext" models
          "out/aiso-engine-${{ matrix.triple }}$ext" audit
          node tools/qa-engine.mjs "out/aiso-engine-${{ matrix.triple }}$ext"
          node tools/qa-graph-engine.mjs "out/aiso-engine-${{ matrix.triple }}$ext"
          node tools/qa-free-time-engine.mjs "out/aiso-engine-${{ matrix.triple }}$ext"
          node tools/qa-restore-engine.mjs "out/aiso-engine-${{ matrix.triple }}$ext"
      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.triple }}
          path: out/*

  # ---------------------------------------------------------------- desktop apps
  desktop:
    needs: engine
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
            triple: x86_64-unknown-linux-gnu
            args: --bundles appimage,deb,rpm
          - os: windows-latest
            name: windows
            triple: x86_64-pc-windows-msvc
            args: --bundles nsis,msi
          - os: macos-latest
            name: mac
            triple: universal-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'mac' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Linux build deps
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm xvfb imagemagick
      - uses: actions/download-artifact@v4
        with:
          name: engine-${{ matrix.triple }}
          path: app/src-tauri/binaries
      - name: The obfuscated app into the shell
        run: |
          chmod +x app/src-tauri/binaries/* || true
          # A universal macOS build compiles each arch separately and asks for each name.
          U=app/src-tauri/binaries/aiso-engine-universal-apple-darwin
          if [ -f "$U" ]; then cp "$U" app/src-tauri/binaries/aiso-engine-aarch64-apple-darwin; cp "$U" app/src-tauri/binaries/aiso-engine-x86_64-apple-darwin; fi
          ls -la app/src-tauri/binaries
          npm ci && npm ci --prefix host && npm run build
          cp dist/app-shell/index.html app/shell/index.html
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Build
        working-directory: app
        run: npm ci && npx tauri build ${{ matrix.args }}
      - name: Collect under stable names
        run: |
          set -euo pipefail
          mkdir -p out qa
          B=app/src-tauri/target
          case "${{ matrix.name }}" in
            mac)     cp "$(ls $B/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)" out/AISO-macOS-universal.dmg ;;
            windows) cp "$(ls $B/release/bundle/nsis/*-setup.exe | head -1)" out/AISO-Windows-x64-setup.exe
                     cp "$(ls $B/release/bundle/msi/*.msi | head -1)" out/AISO-Windows-x64.msi ;;
            linux)   cp "$(ls $B/release/bundle/appimage/*.AppImage | head -1)" out/AISO-Linux-x86_64.AppImage
                     cp "$(ls $B/release/bundle/deb/*.deb | head -1)" out/AISO-Linux-amd64.deb
                     cp "$(ls $B/release/bundle/rpm/*.rpm | head -1)" out/AISO-Linux-x86_64.rpm ;;
          esac
          ls -la out
      # QA: launch the real app on its own OS. Pass = the bundled engine is up and
      # accepts only its own token (401 to anyone else), plus a screenshot.
      - name: QA (Linux)
        if: matrix.name == 'linux'
        run: |
          export AISO_HOME="$RUNNER_TEMP/qa-home"
          # Headless CI has no GPU: software rendering for WebKitGTK.
          export WEBKIT_DISABLE_DMABUF_RENDERER=1 WEBKIT_DISABLE_COMPOSITING_MODE=1 LIBGL_ALWAYS_SOFTWARE=1
          ls -la app/src-tauri/target/release/ | grep -E "aiso" || true
          app/src-tauri/target/release/aiso-engine models
          xvfb-run -a -s "-screen 0 1280x800x24" bash -c '
            app/src-tauri/target/release/aiso > qa/linux-app.log 2>&1 & APP=$!
            ready=0
            node tools/wait-setup.mjs 8786 && ready=1
            sleep 6
            echo "engine readiness passed: $ready"
            ps -eo pid,args | grep -E "[a]iso" || true
            import -window root qa/linux.png
            kill $APP || true
            cat qa/linux-app.log | grep -v dbind | tail -20
            [ "$ready" = "1" ]'
      - name: QA (macOS)
        if: matrix.name == 'mac'
        run: |
          export AISO_HOME="$RUNNER_TEMP/qa-home"
          clang -fobjc-arc -framework Foundation -framework Vision tools/check-macos-welcome.m -o "$RUNNER_TEMP/check-aiso-welcome"
          APPDIR=$(ls -d app/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app | head -1)
          "$APPDIR/Contents/MacOS/aiso" & APP=$!
          trap 'kill "$APP" 2>/dev/null || true' EXIT
          ready=0
          node tools/wait-setup.mjs 8786 && ready=1
          visible=0
          for attempt in $(seq 1 20); do
            screencapture -x qa/mac.png
            if "$RUNNER_TEMP/check-aiso-welcome" qa/mac.png; then visible=1; break; fi
            sleep 2
          done
          [ "$ready" = "1" ]
          [ "$visible" = "1" ]
      - name: QA (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $env:AISO_HOME = "$env:RUNNER_TEMP\qa-home"
          $p = Start-Process -FilePath "app\src-tauri\target\release\aiso.exe" -PassThru
          node tools/wait-setup.mjs 8786
          $ready = $LASTEXITCODE
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("qa\windows.png")
          Stop-Process -Id $p.Id -Force
          if ($ready -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.name }}
          path: out/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-${{ matrix.name }}
          path: qa/*

  # ---------------------------------------------------------------- the host package
  host:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build twice and require identical bytes (reproducible)
        run: |
          npm ci && npm ci --prefix host
          npm run build && cp dist/SHA256SUMS /tmp/first
          npm run build && diff /tmp/first dist/SHA256SUMS
      - run: |
          mkdir -p out
          cp dist/aiso-host.tgz out/aiso-host.tgz
          cp dist/SHA256SUMS out/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: build-host
          path: out/*

  # ---------------------------------------------------------------- Android (client)
  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The runner image ships the Android SDK; use its own sdkmanager.
      - name: NDK
        timeout-minutes: 15
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)
          (yes || true) | "$SDKM" --install "ndk;27.0.12077973" "platform-tools"
          [ -d "$ANDROID_HOME/ndk/27.0.12077973" ] || { echo "NDK did not install"; exit 1; }
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - name: The obfuscated app into the shell
        run: |
          npm ci && npm ci --prefix host && npm run build
          cp dist/app-shell/index.html app/shell/index.html
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Build (debug-signed APK; arm64 for phones, x86_64 for the emulator)
        working-directory: app
        run: |
          npm ci
          npm run android:init
          npm run android:build -- --debug --apk --target aarch64 --target x86_64
      - name: Collect
        run: |
          set -euo pipefail
          mkdir -p out qa
          # The downloadable APK must support both phones and the emulator we test.
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import shutil
          candidates = []
          for apk in Path('app/src-tauri/gen/android').rglob('*.apk'):
              if 'debug' not in str(apk).lower():
                  continue
              with ZipFile(apk) as bundle:
                  abis = {p.split('/')[1] for p in bundle.namelist() if p.startswith('lib/') and p.endswith('.so')}
              if {'arm64-v8a', 'x86_64'} <= abis:
                  candidates.append(apk)
          if len(candidates) != 1:
              raise SystemExit(f'Expected one arm64 + x86_64 APK, found {candidates}')
          shutil.copyfile(candidates[0], 'out/AISO-Android-arm64.apk')
          print('Verified APK contains arm64-v8a and x86_64 native libraries')
          PY
          ls -la out
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: QA on an emulator (install, launch, screenshot)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: |
            adb install -r out/AISO-Android-arm64.apk
            adb shell cmd uimode night no
            adb shell monkey -p app.tensorrent.aiso -c android.intent.category.LAUNCHER 1
            sleep 20
            adb exec-out screencap -p > qa/android.png
            adb shell pidof app.tensorrent.aiso
            adb shell cmd uimode night yes
            adb shell am force-stop app.tensorrent.aiso
            adb shell monkey -p app.tensorrent.aiso -c android.intent.category.LAUNCHER 1
            sleep 5
            adb exec-out screencap -p > qa/android-dark.png
            adb shell pidof app.tensorrent.aiso
      - uses: actions/upload-artifact@v4
        with:
          name: build-android
          path: out/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-android
          path: qa/*

  # ---------------------------------------------------------------- iOS (client, simulator)
  # A device/App Store build needs the owner's Apple Developer account; this
  # proves the app builds, installs and launches on the iOS Simulator.
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim,aarch64-apple-ios
      - name: The obfuscated app into the shell
        run: |
          npm ci && npm ci --prefix host && npm run build
          cp dist/app-shell/index.html app/shell/index.html
      - name: Generate the Xcode project
        working-directory: app
        run: |
          npm ci
          npx tauri ios init --ci
          ls src-tauri/gen/apple
      - name: Build for the simulator (Tauri drives Xcode; the simulator needs no signing)
        working-directory: app
        run: npx tauri ios build --debug --target aarch64-sim
      - name: QA on the simulator (install, launch, screenshot)
        run: |
          mkdir -p qa out
          APP=$(ls -d app/src-tauri/gen/apple/build/arm64-sim/*.app | head -1)   # the bundle Tauri reports as finished
          echo "app=$APP"
          DEV=$(xcrun simctl list devices available | grep -m1 -E 'iPhone 1[5-9]' | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          xcrun simctl boot "$DEV"
          xcrun simctl install "$DEV" "$APP"
          xcrun simctl launch "$DEV" app.tensorrent.aiso
          sleep 15
          xcrun simctl io "$DEV" screenshot qa/ios.png
          (cd "$(dirname "$APP")" && zip -qry "$GITHUB_WORKSPACE/out/AISO-iOS-Simulator.app.zip" "$(basename "$APP")")
      - uses: actions/upload-artifact@v4
        with:
          name: build-ios-simulator
          path: out/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-ios
          path: qa/*

  # ---------------------------------------------------------------- live online-fallback QA (uses the API credits)
  # Runs only when the owner has added the repo secret ANTHROPIC_API_KEY.
  # One small request through the host's cloud path; the key never leaves CI's secret store.
  fallback-live:
    runs-on: ubuntu-22.04
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        if: env.ANTHROPIC_API_KEY != ''
      - uses: actions/setup-node@v4
        if: env.ANTHROPIC_API_KEY != ''
        with:
          node-version: 22
      - name: One live request through the online fallback
        if: env.ANTHROPIC_API_KEY != ''
        run: |
          npm ci --prefix host
          node --input-type=module -e "
            import { makeCloud } from './host/lib/cloud.mjs';
            import { Router } from './host/lib/router.mjs';
            const r = new Router({ runtimes: [], cloud: makeCloud(process.env.ANTHROPIC_API_KEY), fallback: 'claude-opus-5-5' });
            const out = await r.chat({ model: 'auto', max_tokens: 64, messages: [{ role: 'user', content: 'Reply with the single word: aboard' }] });
            console.log('fallback:', out.route.fallback, out.route.reason, '|', out.json.model, '|', out.json.choices[0].message.content);
            if (!out.route.fallback || !out.json.choices[0].message.content) process.exit(1);
          "
      - name: Skipped (no ANTHROPIC_API_KEY secret)
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "Add the repo secret ANTHROPIC_API_KEY to run the live fallback check."
